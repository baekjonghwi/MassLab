<!--
  Supabase → Authentication → Emails → "Reset password" 본문.
  Subject 칸: MassLabs password reset

  🔴이 링크는 /auth/callback 을 거쳐 app/reset-password 로 떨어진다. 콜백은 세션만
    만들 뿐이라, 새 비밀번호는 그 화면이 updateUser로 받는다.
    ⚠️redirectTo를 정하는 곳은 app/login/page.tsx 의 resetPasswordForEmail 이다 —
      거기를 홈으로 되돌리면 이 메일이 그냥 "로그인 링크"가 된다.
  🔴영어만 쓴다 — confirm-signup.html 의 같은 결정을 따른다.

  ⚠️붙여넣을 때는 이 주석을 빼고 아래 <div>부터 복사한다.
-->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#1a1a1a">
  <div style="font-size:1.25rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:28px">MassLabs</div>

  <p style="font-size:0.95rem;line-height:1.6;margin:0 0 24px">Click below to set a new password for your MassLabs account.</p>

  <a href="{{ .ConfirmationURL }}"
     style="display:inline-block;background:#1a1a1a;color:#fff;text-decoration:none;padding:12px 24px;border-radius:8px;font-size:0.9rem;font-weight:600">
    Set a new password
  </a>

  <hr style="border:none;border-top:1px solid #eee;margin:28px 0 16px">
  <p style="font-size:0.72rem;line-height:1.6;color:#aaa;margin:0">
    If you didn't request this, you can safely ignore this email — your password won't change.
  </p>
</div>
