<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Colorgram">
  <!-- ======================================================================
       Colorgram 제품 칸 사진 — 정사각형을 세로로 여섯 등분한 색 띠.
       (2026-08-27 사용자 지시. 다른 둘은 실제 결과물 사진인데 Colorgram 은
        색 자체가 결과물이라 사진 대신 색을 세운다.)

       🔴색은 짓지 않았다. Colorgram 아이콘(D:\CODE\Colorgram\app\icon.svg)의
         여섯 칸 색을 순서까지 그대로 가져왔다 — 한 색(#E07A5F)의 명도 사다리다.
         ⚠️저쪽 아이콘은 components/BrandMark.tsx 와 한 벌로 움직인다. 저 둘의
           색이 바뀌면 이 파일도 함께 고칠 것 — 안 그러면 제품 칸만 옛 색으로 남는다.

       ⚠️칸(.lp-tile .shot)은 4:3 이고 object-fit:cover 다. 정사각형이 위아래로
         잘리는데, 띠가 세로로 관통하므로 잘려도 그대로 읽힌다.
       ⚠️띠 폭을 100 이 아니라 100.5 로 두어 옆칸에 살짝 겹친다. 딱 맞추면 확대
         비율에 따라 띠 사이에 흰 실선이 그어진다.
  ====================================================================== -->
  <rect x="0"   y="0" width="100.5" height="600" fill="#6F2816"/>
  <rect x="100" y="0" width="100.5" height="600" fill="#9A381E"/>
  <rect x="200" y="0" width="100.5" height="600" fill="#C54726"/>
  <rect x="300" y="0" width="100.5" height="600" fill="#DB6343"/>
  <rect x="400" y="0" width="100.5" height="600" fill="#E3866E"/>
  <rect x="500" y="0" width="100"   height="600" fill="#EBAA98"/>
</svg>
